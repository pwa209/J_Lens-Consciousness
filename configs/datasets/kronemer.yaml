  onset_seconds: "__derived__:behavior_face_time_aligned_to_Fac2"
  event_type: "__literal__:face_onset"
  location: "Face quadrant or task-relevant Face location"
  opacity: "Face opacity or task-relevant Face opacity"
  report: "__derived__:RP_vs_NRP_archive"
  perceived: "Perception answer"
