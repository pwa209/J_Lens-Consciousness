study:
  title: "Testing a Jacobian geometry of conscious access across brains and machines"
  analysis_mode: "ordinary_observational_and_computational_study"
  version: "0.2.0"
  date: "2026-08-11"
  seed: 20260730
  registered_report_claim: false
  target_data_access_requires_aip: false
  prespecified_primary_analyses: true
  article_mode: "ordinary_confirmatory_research_article"

compute:
  cpu_cores: 25
  gpu_count: 1
  gpu_class: "RTX 5090, 32 GB"
  system_ram_gb_minimum: 128
  local_scratch_gb_minimum: 3000
  jacobian_trial_chunk: 64
  metric_time_chunk: 32

crossfit:
  folds: 5
  validation_fraction_of_training: 0.10
  latent_dimensions: 32
  whitening: true
  fold_seed: 20260730

jacobian:
  horizons_samples: [2, 4, 8, 16]
  rank: 4
  persistence_lag_samples: 5
  metric_epsilon: 0.0001
  stream_full_tensors: true
  persist_full_tensors: false
  access_index_components:
    - "log_gain"
    - "logit_broadcast"
    - "fisher_persistence"
    - "logit_concentration"
  component_weights: [0.25, 0.25, 0.25, 0.25]

primary_windows_ms:
  h1_kronemer_early: [175, 225]
  h2_kronemer_late: [350, 650]
  h3_gabor_early: [150, 300]
  h4_somato_positive_control: [100, 200]
  h4_somato_late: [300, 600]

inference:
  test: "directional_JZS_paired_t"
  rscale: 0.5
  support_threshold: 10.0
  contrary_threshold: 0.10
  sign_flips: 5000
  cluster_forming_p: 0.01
  familywise_alpha: 0.05

leakage_controls:
  keep_condition_table_separate_until_metrics: true
  forbidden_primary_model_fields:
    - awareness
    - perceived
    - seen
    - report
    - task
    - response
    - gaze
    - pupil
    - eye_classifier_confidence
